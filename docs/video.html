<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copas — Demo Video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c10;
      color: #f2f2f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 20%, rgba(0, 113, 227, 0.15) 0%, rgba(11, 12, 16, 1) 70%);
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }
    p {
      color: #98989d;
      font-size: 1.05rem;
    }
    .video-container {
      width: 100%;
      max-width: 960px;
      border-radius: 20px;
      overflow: hidden;
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      position: relative;
    }
    video {
      width: 100%;
      display: block;
      outline: none;
    }
    .footer-actions {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.75rem 1.4rem;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary {
      background-color: #0071e3;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.4);
    }
    .btn-secondary {
      background-color: #1c1c1e;
      color: #e5e5ea;
      border: 1px solid #3a3a3c;
    }
  </style>
</head>
<body>
  <div class="header">
    <img class="logo" src="logo.png" alt="Copas">
    <h1>Copas for macOS</h1>
    <p>Watch the 18-second feature walkthrough</p>
  </div>

  <div class="video-container">
    <video controls autoplay loop muted playsinline poster="board.png">
      <source src="copas_demo.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <div class="footer-actions">
    <a class="btn btn-primary" href="https://github.com/sigitkusuma/copas/releases/latest">Download DMG on GitHub</a>
    <a class="btn btn-secondary" href="copas_demo.mp4" download>Download Video (MP4)</a>
  </div>
</body>
</html>
