name: Release

# A pushed vX.Y.Z tag is the only trigger — nothing here runs on a schedule or
# a plain push to main, so cutting a release stays a deliberate act:
#   git tag v1.0.4 && git push origin v1.0.4
on:
  push:
    tags: ["v*"]

# Only one release moves through this pipeline at a time. Two tags pushed
# close together must not race for the same GitHub Release name or fight over
# docs/appcast.xml.
concurrency: release

jobs:
  # Tests already ran when this commit was on main, but a tag is not
  # guaranteed to point at a commit that passed them — re-checking here is the
  # only thing standing between a bad commit and a signed, notarised, publicly
  # distributed release.
  test:
    uses: ./.github/workflows/tests.yml

  release:
    name: Build, sign, notarise, publish
    needs: test
    runs-on: macos-26
    # gh release create needs write access; the default token is read-only
    # unless a workflow asks for more.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/dd/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # Codesigning needs a real, unlocked keychain — the CI runner's default
      # one is neither. Everything here is torn down in the cleanup step below,
      # keychain included, whether or not the release succeeds.
      - name: Import the signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          # Reused by the Sparkle key import below, which needs its own
          # partition-list grant on the same keychain.
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Search this keychain first, but keep the runner's default ones
          # reachable too — codesign still needs Apple's own root certificates.
          # Deliberately unquoted: each existing keychain path must land as its
          # own argument, not one combined string.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')"
          [ -n "$SIGN_IDENTITY" ] || { echo "no Developer ID Application identity in the imported certificate" >&2; exit 1; }
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "imported: $SIGN_IDENTITY"

      - name: Store notarisation credentials
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          xcrun notarytool store-credentials copas-ci \
            --key "$KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$KEY_PATH"

      # Unlike the notary key, this one has no clean rotation — every copy of
      # Copas already installed has today's public key baked into Info.plist,
      # with no way to tell them to trust a different one later. Keeping it
      # off CI entirely was the original design; it now lives here so the
      # appcast doesn't depend on someone remembering to run
      # Scripts/publish-appcast.sh by hand. The mitigation is downstream, not
      # here: publishing the signed appcast still has to go through a
      # branch-protected PR on main (see "Open the appcast update PR" below),
      # so a leak of this secret alone doesn't let an attacker push a
      # malicious update without also getting a human to approve it.
      - name: Import the Sparkle signing key
        env:
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
        run: |
          xcodegen generate >/dev/null
          xcodebuild -project Copas.xcodeproj -scheme Copas -configuration Release \
            -derivedDataPath build/release -resolvePackageDependencies >/dev/null
          SPARKLE_BIN="$(find build -type d -path '*artifacts/sparkle/Sparkle/bin' | head -1)"
          [ -n "$SPARKLE_BIN" ] || { echo "could not find Sparkle's bin directory" >&2; exit 1; }

          KEY_PATH="$RUNNER_TEMP/sparkle_private_key"
          echo "$SPARKLE_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          "$SPARKLE_BIN/generate_keys" -f "$KEY_PATH"
          # Allow applications to access the generic password without GUI prompts on headless CI
          SPARKLE_KEY_CONTENT="$(cat "$KEY_PATH")"
          security add-generic-password -a "ed25519" -s "https://sparkle-project.org" \
            -w "$SPARKLE_KEY_CONTENT" -U -A "$KEYCHAIN_PATH" || true
          rm -f "$KEY_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # Scripts/release.sh reads these rather than taking them as arguments —
      # matching how it works for a person releasing from their own Mac.
      - name: Write release.sh's configuration
        run: |
          cat > .env <<EOF
          SIGN_IDENTITY="$SIGN_IDENTITY"
          NOTARY_PROFILE="copas-ci"
          EOF

      # No --skip-appcast: the key imported above lets release.sh sign
      # docs/appcast.xml itself, using the same build it just notarised.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
        run: Scripts/release.sh "${{ github.ref_name }}"

      # release.sh writes docs/appcast.xml but cannot push it — main is
      # branch-protected. A PR is opened instead and set to auto-merge, so
      # publishing the update still needs one human approval (the mitigation
      # noted above) without needing a manual merge click on top of it.
      - name: Open the appcast update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- docs/appcast.xml; then
            echo "docs/appcast.xml unchanged — nothing to publish"
            exit 0
          fi

          BRANCH="appcast/${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/appcast.xml
          git commit -m "Release ${{ github.ref_name }}: update Sparkle appcast"
          git push origin "$BRANCH"

          gh pr create --title "Release ${{ github.ref_name }}: update Sparkle appcast" \
            --body "Signed appcast entry for \`${{ github.ref_name }}\`, generated and signed by the release workflow." \
            --base main
          # Non-fatal: needs "Allow auto-merge" on in the repo's settings. The
          # PR above is the part that matters — it exists either way, waiting
          # on the one required review — this only saves a manual merge click
          # once that review lands.
          gh pr merge "$BRANCH" --auto --squash \
            || echo "::warning::couldn't enable auto-merge — merge the appcast PR by hand once it's approved"

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
