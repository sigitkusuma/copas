name: Feature request
description: Something Copas doesn't do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, not the mechanism — describe what you're stuck on before proposing how to fix it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd want instead
      description: A shortcut, a search filter, a setting — as concrete as you can make it.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: Existing keys, settings, or workarounds that get partway there.
    validations:
      required: false
